
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flat Business Profile Widget</title>

    <link rel="stylesheet" href="login-form.css">
</head>

<body>

    <!-- Profile Picture -->
    <div class="image-container">
        <img
            src="img/images-photo.jpg"
            alt="Profile Picture"
        >
    </div>

    <!-- Login Form Container -->
    <main>

        <h1>Flat Business Profile Widget</h1>

        <form action="#" method="post">

            <!-- Name Field -->
            <div class="field">
                <img
                    src="img/user.png"
                    alt=""
                    class="field-icon"
                >

                <input
                    type="text"
                    name="username"
                    placeholder="Name"
                    aria-label="Name"
                    autocomplete="username"
                    required
                >
            </div>

            <!-- Password Field -->
            <div class="field">
                <img
                    src="img/pass.png"
                    alt=""
                    class="field-icon"
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    aria-label="Password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Submit">

        </form>

    </main>

    <!-- Footer -->
    <footer>
        &copy; 2016 Flat Business Profile Widget. All rights reserved
    </footer>

</body>
</html>
