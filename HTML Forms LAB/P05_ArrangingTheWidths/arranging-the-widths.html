<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arranging the Widths</title>
  <link rel="stylesheet" href="arranging-the-widths.css">
</head>
<body>
  <form action="#" method="post">
    <fieldset>
      <legend>Rent Audi Vehicles</legend>
      <label for="name">Named</label>
      <input id="name" name="name" type="text" placeholder="Enter your name" required>
      <label for="vehicle">Select</label>
      <select id="vehicle" name="vehicle" required>
        <option value="Audi 80">Audi 80</option>
        <option value="Audi 90">Audi 90</option>
        <option value="Audi RS 6">Audi RS 6</option>
        <option value="Audi S8">Audi S8</option>
      </select>
      <label for="extra">Select</label>
      <select id="extra" name="extra">
        <option value="">Select</option>
        <option value="Automatic">Automatic</option>
        <option value="Manual">Manual</option>
      </select>
      <label for="message">Message:</label>
      <textarea id="message" name="message"></textarea>
    </fieldset>
  </form>
</body>
</html>
