<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form Background Images</title>
  <link rel="stylesheet" href="login-form.css">
</head>
<body>
  <div class="image-container"><img src="profile.jpg" alt="Profile portrait"></div>
  <main>
    <h1>Flat Business Profile Widget</h1>
    <form action="#" method="post">
      <div class="field"><input class="username" type="text" name="username" placeholder="Name" aria-label="Name" required></div>
      <div class="field"><input class="password" type="password" name="password" placeholder="Password" aria-label="Password" required></div>
      <input type="submit" value="Submit">
    </form>
  </main>
  <footer>© 2016 Flat Business Profile Widget. All rights reserved</footer>
</body>
</html>
